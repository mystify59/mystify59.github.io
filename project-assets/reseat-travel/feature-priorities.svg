<svg xmlns="http://www.w3.org/2000/svg" width="760" height="592" viewBox="0 0 760 592" role="img" aria-labelledby="title desc"><title id="title">Review-derived passenger feature priorities</title><desc id="desc">Two illustrative passenger profiles based on five economy-flight review videos. Bars preserve the original Figma relative lengths. They are not numerical survey results.</desc><style>text{font-family:Arial,Helvetica,sans-serif}path,line{stroke-linejoin:round;stroke-linecap:round}</style><rect x="0" y="0" width="760" height="592" fill="#101214" /><text x="32" y="48" font-size="28" fill="#f2f5fa" font-weight="600" >Different journeys,</text><text x="32" y="81" font-size="28" fill="#f2f5fa" font-weight="600" >different priorities</text><line x1="32" y1="115" x2="54" y2="115" stroke="#8bb8ff" stroke-width="4"/><text x="64" y="120" font-size="15" fill="#f2f5fa" font-weight="400" >Frequent traveller</text><line x1="321" y1="115" x2="343" y2="115" stroke="#77d9d2" stroke-width="4"/><text x="353" y="120" font-size="15" fill="#f2f5fa" font-weight="400" >Sustainability-minded traveller</text><text x="32" y="177" font-size="17" fill="#f2f5fa" font-weight="500" >Legroom / seat pitch</text><rect x="272" y="160" width="456" height="8" fill="#8bb8ff" data-source-node="7:506" data-source-width="90.34951782226562"/><rect x="272" y="175" width="242.2591788819259" height="8" fill="#77d9d2" data-source-node="7:509" data-source-width="48"/><text x="32" y="239" font-size="17" fill="#f2f5fa" font-weight="500" >Recline and support</text><rect x="272" y="222" width="358.3417020961821" height="8" fill="#8bb8ff" data-source-node="7:512" data-source-width="71"/><rect x="272" y="237" width="242.2591788819259" height="8" fill="#77d9d2" data-source-node="7:515" data-source-width="48"/><text x="32" y="301" font-size="17" fill="#f2f5fa" font-weight="500" >Power outlet</text><rect x="272" y="284" width="456" height="8" fill="#8bb8ff" data-source-node="7:518" data-source-width="90.34951782226562"/><rect x="272" y="299" width="456" height="8" fill="#77d9d2" data-source-node="7:521" data-source-width="90.34951782226562"/><text x="32" y="363" font-size="17" fill="#f2f5fa" font-weight="500" >Reliable tray table</text><rect x="272" y="346" width="239.51514081902388" height="8" fill="#8bb8ff" data-source-node="7:524" data-source-width="47.4563102722168"/><rect x="272" y="361" width="358.3417020961821" height="8" fill="#77d9d2" data-source-node="7:527" data-source-width="71"/><text x="32" y="425" font-size="17" fill="#f2f5fa" font-weight="500" >Eco-features</text><rect x="272" y="408" width="156.60605953644784" height="8" fill="#8bb8ff" data-source-node="7:530" data-source-width="31.02912712097168"/><rect x="272" y="423" width="454.23596040361105" height="8" fill="#77d9d2" data-source-node="7:533" data-source-width="90"/><text x="32" y="487" font-size="17" fill="#f2f5fa" font-weight="500" >Seat pocket / storage</text><rect x="272" y="470" width="156.60605953644784" height="8" fill="#8bb8ff" data-source-node="7:536" data-source-width="31.02912712097168"/><rect x="272" y="485" width="90.84719208072221" height="8" fill="#77d9d2" data-source-node="7:539" data-source-width="18"/><line x1="32" y1="529" x2="728" y2="529" stroke="#354252" /><text x="32" y="551" font-size="13" fill="#b9c4d3" font-weight="400" >Qualitative synthesis of 5 review videos.</text><text x="32" y="571" font-size="13" fill="#b9c4d3" font-weight="400" >Original relative bar lengths · No survey scores.</text></svg>
