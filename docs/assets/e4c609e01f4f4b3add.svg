<svg xmlns="http://www.w3.org/2000/svg" width="350" height="704" viewBox="0 0 350 704" role="img" aria-labelledby="title desc"><title id="title">Review-derived passenger feature priorities</title><desc id="desc">Two illustrative passenger profiles based on five economy-flight review videos. Bars preserve the original Figma relative lengths. They are not numerical survey results.</desc><style>text{font-family:Arial,Helvetica,sans-serif}path,line{stroke-linejoin:round;stroke-linecap:round}</style><rect x="0" y="0" width="350" height="704" fill="#101214" /><text x="26" y="39" font-size="23" fill="#f2f5fa" font-weight="600" >Different journeys,</text><text x="26" y="68" font-size="23" fill="#f2f5fa" font-weight="600" >different priorities</text><line x1="26" y1="99" x2="48" y2="99" stroke="#8bb8ff" stroke-width="4"/><text x="58" y="104" font-size="14" fill="#f2f5fa" font-weight="400" >Frequent traveller</text><line x1="26" y1="126" x2="48" y2="126" stroke="#77d9d2" stroke-width="4"/><text x="58" y="131" font-size="14" fill="#f2f5fa" font-weight="400" >Sustainability-minded traveller</text><text x="26" y="178" font-size="16" fill="#f2f5fa" font-weight="500" >Legroom / seat pitch</text><rect x="26" y="192" width="298" height="8" fill="#8bb8ff" data-source-node="7:506" data-source-width="90.34951782226562"/><rect x="26" y="207" width="158.3184984798551" height="8" fill="#77d9d2" data-source-node="7:509" data-source-width="48"/><text x="26" y="254" font-size="16" fill="#f2f5fa" font-weight="500" >Recline and support</text><rect x="26" y="268" width="234.17944566811897" height="8" fill="#8bb8ff" data-source-node="7:512" data-source-width="71"/><rect x="26" y="283" width="158.3184984798551" height="8" fill="#77d9d2" data-source-node="7:515" data-source-width="48"/><text x="26" y="330" font-size="16" fill="#f2f5fa" font-weight="500" >Power outlet</text><rect x="26" y="344" width="298" height="8" fill="#8bb8ff" data-source-node="7:518" data-source-width="90.34951782226562"/><rect x="26" y="359" width="298" height="8" fill="#77d9d2" data-source-node="7:521" data-source-width="90.34951782226562"/><text x="26" y="406" font-size="16" fill="#f2f5fa" font-weight="500" >Reliable tray table</text><rect x="26" y="420" width="156.5252455352393" height="8" fill="#8bb8ff" data-source-node="7:524" data-source-width="47.4563102722168"/><rect x="26" y="435" width="234.17944566811897" height="8" fill="#77d9d2" data-source-node="7:527" data-source-width="71"/><text x="26" y="482" font-size="16" fill="#f2f5fa" font-weight="500" >Eco-features</text><rect x="26" y="496" width="102.34343364443302" height="8" fill="#8bb8ff" data-source-node="7:530" data-source-width="31.02912712097168"/><rect x="26" y="511" width="296.84718464972826" height="8" fill="#77d9d2" data-source-node="7:533" data-source-width="90"/><text x="26" y="558" font-size="16" fill="#f2f5fa" font-weight="500" >Seat pocket / storage</text><rect x="26" y="572" width="102.34343364443302" height="8" fill="#8bb8ff" data-source-node="7:536" data-source-width="31.02912712097168"/><rect x="26" y="587" width="59.36943692994566" height="8" fill="#77d9d2" data-source-node="7:539" data-source-width="18"/><line x1="26" y1="632" x2="324" y2="632" stroke="#354252" /><text x="26" y="654" font-size="12" fill="#b9c4d3" font-weight="400" >Qualitative synthesis of 5 review videos.</text><text x="26" y="674" font-size="12" fill="#b9c4d3" font-weight="400" >Original relative bar lengths · No survey scores.</text></svg>
